[project]
name = "market-pulse-bot"
version = "0.1.0"
description = "Telegram bot for Yahoo Finance market data: latest OHLC candles, candlestick chart screenshots, and quote snapshots"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mplfinance>=0.12.10b0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
    "yfinance>=1.7.0",
]

[project.scripts]
market-pulse-bot = "market_pulse_bot.bot:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
